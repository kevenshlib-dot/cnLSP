# 在 csl-keywords-jieba-raw 的项目配置后追加这一节即可启用大模型重排。
# endpoint 指向任一 OpenAI 兼容接口：
#   本地 Ollama：http://host.docker.internal:11434/v1（容器内访问宿主机）
#   假大模型（测试/演示）：python -m annif_zh.llm.fake_server --port 8765
# 云端服务的 API 密钥放在环境变量里（api_key_env 指定变量名），不要写进本文件。

[csl-llm]
name=CSL keywords + LLM rerank
language=zh
backend=llm_rerank
vocab=csl-keywords
sources=csl-ensemble
limit=10
candidates=30
select=8
blend=0.7
mode=rerank
endpoint=http://127.0.0.1:8765/v1
model=fake
api_key_env=LLM_API_KEY
concurrency=8
examples=0

# DeepSeek 云端（2026-10 实测可用）。V4 系列默认开启思考，必须关闭，
# 否则 max_tokens 会耗在思考上、正文为空。密钥放在 annif-zh/.env.llm（已 gitignore），
# 运行容器时用 --env-file .env.llm 传入。
[csl-ds-flash]
name=CSL keywords + DeepSeek flash rerank
language=zh
backend=llm_rerank
vocab=csl-keywords
sources=csl-ensemble
limit=10
candidates=30
select=8
blend=0.7
mode=rerank
endpoint=https://api.deepseek.com
model=deepseek-flash
thinking=disabled
api_key_env=LLM_API_KEY
concurrency=8
examples=0
