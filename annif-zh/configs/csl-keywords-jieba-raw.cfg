# CSL 关键词：三个基础后端 + 三种集成方式
# 基础后端在 train 集上训练；集成在 dev 集上训练或调权；最终只在 test 集上评测。
# 输入是原始中文，由 jieba 分析器（annif_zh）在 Annif 内部分词。

[csl-tfidf]
name=CSL keywords TF-IDF
language=zh
backend=tfidf
analyzer=jieba(userdict=/in/userdict.txt,stopwords=/in/stopwords.txt)
vocab=csl-keywords
limit=100

[csl-omikuji]
name=CSL keywords Omikuji Bonsai
language=zh
backend=omikuji
analyzer=jieba(userdict=/in/userdict.txt,stopwords=/in/stopwords.txt)
vocab=csl-keywords
limit=100
cluster_balanced=False
cluster_k=100
max_depth=3
min_df=2

[csl-fasttext]
name=CSL keywords fastText
language=zh
backend=fasttext
analyzer=jieba(userdict=/in/userdict.txt,stopwords=/in/stopwords.txt)
vocab=csl-keywords
limit=100
dim=300
lr=0.25
epoch=20
loss=hs

[csl-ensemble]
name=CSL keywords simple ensemble
language=zh
backend=ensemble
vocab=csl-keywords
sources=csl-tfidf:1,csl-omikuji:1,csl-fasttext:1
limit=100

[csl-pav]
name=CSL keywords PAV ensemble
language=zh
backend=pav
vocab=csl-keywords
sources=csl-tfidf,csl-omikuji,csl-fasttext
limit=100

[csl-nn]
name=CSL keywords neural ensemble
language=zh
backend=nn_ensemble
vocab=csl-keywords
sources=csl-tfidf,csl-omikuji,csl-fasttext
limit=100
nodes=100
dropout_rate=0.2
epochs=10
