# fastText 网格：只在 train 上训练、dev 前 5000 篇上比较；test 留到最后
# ft-a 即当前集成里用的设置（dim=300, lr=0.25, epoch=20）

[ft-a]
name=fastText dim300 lr0.25 ep20
language=zh
backend=fasttext
analyzer=simple(token_min_length=1)
vocab=csl-keywords
limit=100
dim=300
lr=0.25
epoch=20
loss=hs

[ft-b]
name=fastText dim300 lr0.5 ep30 ng2
language=zh
backend=fasttext
analyzer=simple(token_min_length=1)
vocab=csl-keywords
limit=100
dim=300
lr=0.5
epoch=30
wordNgrams=2
loss=hs

[ft-c]
name=fastText dim500 lr0.25 ep50
language=zh
backend=fasttext
analyzer=simple(token_min_length=1)
vocab=csl-keywords
limit=100
dim=500
lr=0.25
epoch=50
loss=hs

[ft-d]
name=fastText dim300 lr0.5 ep50 ng2 minCount2
language=zh
backend=fasttext
analyzer=simple(token_min_length=1)
vocab=csl-keywords
limit=100
dim=300
lr=0.5
epoch=50
wordNgrams=2
minCount=2
loss=hs

[ft-e]
name=fastText dim100 lr1.0 ep25 ng2
language=zh
backend=fasttext
analyzer=simple(token_min_length=1)
vocab=csl-keywords
limit=100
dim=100
lr=1.0
epoch=25
wordNgrams=2
loss=hs
